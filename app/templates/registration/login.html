{% extends "editor/base.html" %}
{% load i18n %}

{% block title %}{% trans "Log in" %} | {% trans "AfWN Editor" %}{% endblock %}

{% block content %}
  <h1>{% trans "Log in" %}</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
    <button type="submit" class="btn btn-primary">{% trans "Log in" %}</button>
  </form>
{% endblock %}
