{% load i18n %}
<pre class="relation-tree"><span
    class="connector"
    aria-hidden="true">{{ connector }}</span><button type="button"
    class="btn btn-sm btn-add py-0"
    aria-label="{% trans 'Add' %}"

    hx-target="next .relation-form">+</button></pre>
