{% load editor %}
{% load i18n %}
{% spaceless %}
{% if words %}
  <ul class="dropdown-menu show w-100">
    {% for word in words %}
    <li>
      <button
          class="dropdown-item"
          name="word_pk"
          value="{{ word.pk }}"
          hx-post="{% url 'editor:add_sense_htmx' pk=synset.pk %}"
          hx-target="closest .senses-section"
    >{{ word.text | highlight:q }}</button>
    </li>
    {% endfor %}
  </ul>
{% else %}
  <p class="text-secondary small mt-2 mb-0">{% trans "No words found." %}</p>
{% endif %}
{% endspaceless %}
