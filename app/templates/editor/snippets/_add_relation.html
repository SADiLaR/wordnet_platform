{% load i18n %}
<form method="get" action="{% url 'editor:add_relation_htmx' pk=synset.pk %}"
      hx-get="{% url 'editor:add_relation_htmx' pk=synset.pk %}"
      hx-trigger="input delay:300ms"
      hx-target="next .relation-results"
      hx-select=".relation-results"
      hx-swap="outerHTML">
  <input type="hidden" name="type" value="{{ type }}">
  <input type="hidden" name="direction" value="{{ direction }}">
  <div class="d-flex gap-2">
    <input type="text" name="q" class="form-control form-control-sm" placeholder="{% trans 'Search synsets…' %}" value="{{ q }}">
    <button type="button" class="btn btn-sm btn-outline-secondary"
            hx-get="{% url 'editor:clear_htmx' %}?target_id=add-{{ direction }}-{{ type }}"
            hx-target="#add-{{ direction }}-{{ type }}"
            hx-swap="innerHTML">{% trans "Cancel" %}</button>
  </div>
</form>
{% include "editor/snippets/_relation_results.html" %}
