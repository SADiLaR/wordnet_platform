{% load i18n %}
{% comment %}
cancel_target (required): what Cancel empties. Pass the slot the search form was
loaded into, so that the results below the search bar and the form go too.
{% endcomment %}
<div class="synset-search d-flex gap-2">
    <input type="search"
           name="q"
           class="form-control form-control-sm"
           placeholder="{% trans 'Search synsets…' %}"
           autocomplete="off"
           autofocus
           hx-get="{% url 'editor:search_synsets_htmx' pk=wordnet_id %}"
           hx-trigger="input delay:300ms"
           hx-target="next .results"
    >
    <button type="button" class="btn btn-sm btn-outline-secondary"
            hx-get="{% url 'editor:clear_htmx' %}"
            hx-target="{{ cancel_target }}"
    >
        {% trans "Cancel" %}
    </button>
</div>
<div class="results"></div>
