{% load editor %}
{% load i18n %}
{% spaceless %}
{% if synsets %}
    <ul class="dropdown-menu show">
        {% for result in synsets %}
        <li>
            <button class="dropdown-item" name="target_pk" value="{{ result.pk }}">{{ result | highlight:q }}</button>
        </li>
        {% endfor %}
    </ul>
{% else %}
    <p class="text-secondary small mt-2 mb-0">{% trans "No synsets found." %}</p>
{% endif %}
{% endspaceless %}
