# https://docs.docker.com/build/ci/github-actions/push-multi-registries/
name: docker_push_deploy_test

on:
  workflow_dispatch:
  push:
    branches:
      - "master"

permissions:
  contents: read

jobs:
  deploy_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # 4.2.0
      - name: Login to SADiLaR Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # 4.6.0
        with:
          registry: docker.sadilar.org
          username: ${{ vars.SADILAR_DOCKER_REPOSITORY_USER }}
          password: ${{ secrets.SADILAR_DOCKER_REPOSITORY_SECRET }}
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # 7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            docker.sadilar.org/wordnet_platform:latest
      - name: Use webhook action to start deployment
        uses: joelwmale/webhook-action@cc1a66f987e1591785273fd6f9d2f7a9d8d7c9cd # 2.4.1
        with:
          url: https://api.bitbucket.org/2.0/repositories/team_sadilar/ansible/pipelines/
          headers: '{"Authorization": "Bearer ${{ secrets.BITBUCKET_PIPELINE_SECRET }}"}'
          body: '{"target": {"ref_type": "branch", "type": "pipeline_ref_target", "ref_name": "master", "selector": {"type": "custom", "pattern": "deploy_wordnet_test" }   }}'
