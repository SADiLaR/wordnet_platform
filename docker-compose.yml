# This is  meant for local development, but should give an idea of what you
# can consider in production.

services:
  db:
    image: postgres:18
    container_name: sadilar-wordnet-db
    environment:
      - POSTGRES_DB=wordnet_db
      - POSTGRES_USER=sadilar
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "5432:5432"
  web:
    build:
      context: .
      dockerfile: Dockerfile-dev
    container_name: sadilar-wordnet-web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./app:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=${DEBUG}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=wordnet_db  # see POSTGRES_DB above
      - DB_USER=sadilar  # see POSTGRES_USER above
      - DB_PASSWORD=${DB_PASSWORD} # see POSTGRES_PASSWORD above
      - EMAIL_HOST=${EMAIL_HOST:-localhost}
      - EMAIL_PORT=${EMAIL_PORT:-25}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS:-False}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER:-}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:-}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-webmaster@localhost}
      - SERVER_EMAIL=${SERVER_EMAIL:-root@localhost}
      - "EMAIL_SUBJECT_PREFIX=${EMAIL_SUBJECT_PREFIX:-[Django] }"
      - ADMINS=${ADMINS:-}
      - EMAIL_BACKEND_CONSOLE=${EMAIL_BACKEND_CONSOLE:-True}
volumes:
  postgres_data:
