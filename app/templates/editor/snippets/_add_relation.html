{% load i18n %}
<form
      hx-post="{% url 'editor:add_relation_htmx' pk=synset.pk %}"

      hx-swap="outerHTML"
      hx-disinherit="hx-swap"
>

    <input type="hidden" name="direction" value="{{ direction }}">
    {% include "editor/snippets/_synset_search_bar.html" with wordnet_id=synset.wordnet_id %}
</form>
