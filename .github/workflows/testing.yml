name: Run repository tests

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  run-tests:
    runs-on: ubuntu-latest
    env:
      DEBUG: "False"
      SECRET_KEY: "django-insecure-ci-only"
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: wordnet_db
      DB_USER: sadilar
      DB_PASSWORD: sadilar
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: sadilar
          POSTGRES_PASSWORD: sadilar
          POSTGRES_DB: wordnet_db
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # 7.0.0
        with:
          python-version: 3.12
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Manager Check
        run: |
          cd app/
          python manage.py check
      - name: Check no migrations need to be made
        run: |
          cd app/
          python manage.py makemigrations --check --no-input
      - name: Run unit tests
        run: |
          cd app/
          python manage.py test

  lint-commits:
    runs-on: ubuntu-latest
    if: github.event.ref != 'refs/heads/master'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Get all commits on current master
        run: git fetch origin master
      - name: Log all commits we will analyse
        run: git log --pretty=format:%s origin/master..HEAD

      # - We use -v here, which inverts the match, because we want to output an exit status of 1 when a match _is_
      #   found (usually 0 is for a match)
      # - We use a -z here, which makes \0 be the line separator, because if feeding multiline text into grep, it will
      #   exit with a status of 0 regardless of whether there is a match (so, -z makes it treat the input as one line)
      - name: Disallow fixup commits
        run: git log --pretty=format:%s origin/master..HEAD | grep -zv 'fixup!'
      - name: Disallow squash commits
        run: git log --pretty=format:%s origin/master..HEAD | grep -zv 'squash!'
      - name: Disallow edit commits
        run: git log --pretty=format:%s origin/master..HEAD | grep -zv 'edit!'
      - name: Disallow drop commits
        run: git log --pretty=format:%s origin/master..HEAD | grep -zv 'drop!'
