{% extends "editor/base.html" %}
{% load i18n %}

{% block title %}{% trans "Queue" %} — {% trans "AfWN Editor" %}{% endblock %}

{% block content %}
<h1 class="h4 mb-3">{% trans "Queue" %}</h1>
<div class="d-flex align-items-center gap-2 mb-3">
  <label for="wordnetSelect" class="text-secondary small mb-0">{% trans "Wordnet:" %}</label>
  <select id="wordnetSelect" class="form-select form-select-sm w-auto"
          onchange="window.location.href = this.value ? '?wordnet=' + encodeURIComponent(this.value) : '.'">
    <option value="">{% trans "All" %}</option>
    {% for w in wordnets %}
      <option value="{{ w.name }}"{% if request.GET.wordnet == w.name %} selected{% endif %}>{{ w.name }}</option>
    {% endfor %}
  </select>
</div>
<p class="text-secondary">{% trans "No assignments yet." %}</p>
{% endblock %}
