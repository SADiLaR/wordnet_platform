{% load i18n %}
<form class="mt-2"
      hx-post="{% url 'editor:add_relation_htmx' pk=synset.pk %}"
      hx-target="#relations-section"
      hx-swap="innerHTML">
    <div class="d-flex gap-2 mb-2">
        <div class="btn-group btn-group-sm" role="group" aria-label="{% trans 'Direction' %}">
            <input type="radio"
                   class="btn-check"
                   name="direction"
                   id="dir-out"
                   value="outgoing"
                   autocomplete="off"
                   aria-label="{% trans 'Outgoing' %}"
                   checked
            >
            {% comment %}
            &#xFE0E; is the Unicode text presentation selector — it forces ▶/◀
            to render as plain text glyphs rather than coloured emoji
            {% endcomment %}
            <label class="btn btn-outline-secondary" for="dir-out" aria-hidden="true">──▶&#xFE0E;</label>
            <input type="radio"
                   class="btn-check"
                   name="direction"
                   id="dir-in"
                   value="incoming"
                   autocomplete="off"
                   aria-label="{% trans 'Incoming' %}"
            >
            <label class="btn btn-outline-secondary" for="dir-in" aria-hidden="true">◀&#xFE0E;──</label>
        </div>
        <select name="type" class="form-select form-select-sm" required>
            <option value="">{% trans "— relation type —" %}</option>
            {% for t in types %}
                <option value="{{ t.id }}"{% if type == t.name %} selected{% endif %}>{{ t.name }}</option>
            {% endfor %}
        </select>
    </div>
    {% include "editor/snippets/_relation_search_bar.html" %}
</form>
